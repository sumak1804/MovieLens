models:
  - name: src_tags
    description: "This model extracts the tags from the source data"
    columns:
      - name: user_id
        description: "The unique identifier for the user"
        tests:
          - not_null
         # - unique
      - name: movie_id
        description: "The unique identifier for the movie"
        tests:
          - not_null
         # - unique
      - name: tag
        description: "The tag associated with the movie"
      - name: tag_timestamp
        description: "The timestamp when the tag was added"

  - name: src_ratings
    description: "This indicates the ratings given to the source data"
    columns:
      - name: user_id
        decription: "The unique identifer for the user"
        tests:
          - not_null
         # - unique
      - name: movie_id
        description: "The unique identifier for the movie"
        tests:
          - not_null
         # - unique
      - name: rating
        description: "The rating given by the usr to the movie"
      - name: rating_timestamp
        description: "The timestamp when the rating given to the movie"

  - name: src_movies
    description: "The list of movies in the source data"
    columns:
      - name: movie_id
        description: "The unique identifier for the movie"
        tests:
          - not_null
          - unique
      - name: title
        description: "The title of the movie"
        test:
          - not_null
          - unique
      - name: genres
        description: "The genres associated with the movie"
        tests:
          - not_null

  - name: src_links
    description: "The links associated with the movies"
    columns:
      - name: movie_id
        description: "The unique identifier for the movie"
        tests:
          - not_null
          - unique
      - name: imdb_id
        description: "The unique identifier for the movie in the IMDB database"
        tests:
          - not_null
          - unique  
      - name: tmdb_id
        description: "The unique identifier for the movie in the TMDB database"
        

  - name: src_genome_tags
    description: "The genome tags associated with the movies"
    columns:
      - name: tag_id
        description: "The unique identifier for the genome tag"
        tests:
          - not_null
          - unique
      - name: tag
        description: "The genome tag associated with the movie"
        tests:
          - not_null
          - unique

  - name: src_genome_scores
    description: "The genome scores associated with the movies"
    columns:
      - name: movie_id
        description: "The unique identifier for the movie"
        tests:
          - not_null
          - unique
      - name: tag_id
        description: "The unique identifier for the genome tag"
        tests:
          - not_null
          - unique
      - name: relevance
        description: "The relevance score of the genome tag for the movie"

  - name: dim_movies
    description: Dimension table for cleansed movie metadata
    columns:
      - name: movie_id
        description: Primary key of the movie
        tests:
          - unique
          - not_null
      - name: movie_title
        description: Standardized movie title
        tests:
          - not_null
      - name: genre_array
        description: List of genres in array format
      - name: genres
        description: Raw genre string from source

  - name: dim_users
    description: Dimension table of unique users from both ratings and tags
    columns:
      - name: user_id
        description: Unique user identifier
        tests:
          - unique
          - not_null

  - name: dim_genome_tags
    description: Dimension table of genome tag labels
    columns:
      - name: tag_id
        description: Unique tag ID
        tests:
          - not_null
          - unique
      - name: tag_name
        description: Cleaned, human-readable tag name
        tests:
          - not_null

  - name: fct_ratings
    description: Fact table of user ratings for movies
    columns:
      - name: user_id
        description: Foreign key to dim_users
        tests:
          - not_null
      - name: movie_id
        description: Foreign key to dim_movies
        tests:
          - not_null
          - relationships:
              to: ref('dim_movies')
              field: movie_id
      - name: rating
        description: User's rating for a movie
        tests:
          - not_null
      - name: rating_timestamp
        description: Unix timestamp when the rating was made

  - name: fct_genome_scores
    description: Fact table of relevance scores per movie and tag
    columns:
      - name: movie_id
        description: Foreign key to dim_movies
        tests:
          - not_null
      - name: tag_id
        description: Foreign key to dim_genome_tags
        tests:
          - not_null
      - name: relevance_score
        description: Relevance score (0 to 1) for tag's association with movie
        tests:
          - not_null